# Scrape the scenario services running on the host (bootstrap/scenario/scenario.sh).
# Used by ops/compose.scenario.yaml (host networking) or a local prometheus binary.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: oracle
    static_configs: [{ targets: ["127.0.0.1:9180"] }]
  - job_name: router
    static_configs: [{ targets: ["127.0.0.1:9181"] }]
  - job_name: mm
    static_configs: [{ targets: ["127.0.0.1:9182"] }]
  - job_name: flow
    static_configs: [{ targets: ["127.0.0.1:9183"] }]
  - job_name: arb
    static_configs: [{ targets: ["127.0.0.1:9184"] }]
