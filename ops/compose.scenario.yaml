# Observability for the market-making scenario. The services run on the host
# (bootstrap/scenario/scenario.sh), so Prometheus and Grafana use host
# networking to scrape them on 127.0.0.1:9180-9184. Ports (Prometheus 9190,
# Grafana 3100) avoid the default stack in ops/compose.yaml.
#   bootstrap/scenario/scenario.sh observe  → Grafana http://127.0.0.1:3100
#   (user admin, password $GRAFANA_PASSWORD, default admin; loopback only)
name: mtm-scenario

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=127.0.0.1:9190
    volumes:
      - ./prometheus.scenario.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3100"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/scenario.json
    volumes:
      - ./grafana/scenario/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana/scenario/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
