# Base stack: oracle + observability. Default profile is testnet.
#   testnet: just up testnet    (MTM_PROFILE=testnet docker compose -f ops/compose.yaml up -d --build)
#   local:   just up local      (adds ops/compose.local.yaml — RPC points at surfpool on the HOST,
#                                start it first: pnpm surfpool:mainnet)
# Secrets (when the bots land): wrap with `doppler run --` so keypairs arrive as env.

name: mtm

services:
  oracle:
    build:
      context: ..
      dockerfile: ops/oracle-service.dockerfile
    image: mtm:latest
    restart: unless-stopped
    environment:
      MTM_PROFILE: ${MTM_PROFILE:-testnet}
      # bind beyond loopback inside the container network (never published raw)
      MTM_ORACLE__LISTEN_ADDR: 0.0.0.0:8080
      MTM_ORACLE__METRICS_ADDR: 0.0.0.0:9100
      # required; Bearer token from pythdata.app
      MTM_ORACLE__HERMES__API_KEY: ${PYTH_API_KEY:-}
      # optional; keyless works at the default 5-min cadence
      MTM_ORACLE__COINGECKO__API_KEY: ${COINGECKO_API_KEY:-}
      RUST_LOG: ${RUST_LOG:-info}
      # restarts carry synthetic prices on instead of re-anchoring them
      MTM_ORACLE__STATE_PATH: /app/state/pricing.json
    volumes:
      - ../config:/app/config:ro
      - oracle-state:/app/state
    ports:
      # host loopback only — the oracle has no auth
      - "127.0.0.1:8080:8080"
    # Readiness: every instrument published recently (the distroless image
    # has no curl; the binary probes itself). A dead task already exits the
    # process and `restart` brings it back; this catches a feed that retries
    # forever, shows it in `docker compose ps`, and gates `depends_on:
    # condition: service_healthy` for the bots. Compose does not restart an
    # unhealthy container; the oracle_ready gauge carries the same signal.
    healthcheck:
      test:
        ["CMD", "/usr/local/bin/oracle", "ready", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 12s
      retries: 3
      start_period: 60s

  # --- bots: uncomment when arb/mm rejoin the workspace --------------------------
  # arb:
  #   image: mtm:latest
  #   entrypoint: ["/usr/local/bin/arb"]
  #   restart: unless-stopped
  #   depends_on:
  #     oracle: { condition: service_healthy }
  #   environment:
  #     MTM_PROFILE: ${MTM_PROFILE:-testnet}
  #     MTM_ARB__ORACLE_HTTP_URL: http://oracle:8080
  #     MTM_ARB__METRICS_ADDR: 0.0.0.0:9101
  #   volumes:
  #     - ../config:/app/config:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  oracle-state:
  prometheus-data:
  grafana-data:
