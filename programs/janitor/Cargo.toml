[package]
name = "janitor"
description = "Closes a scenario's DEX accounts after it is deployed over their programs"
version = "0.1.0"
edition = "2024"
publish = false

# Built with the SBF toolchain (`just build-janitor`), so it is its own
# workspace rather than a member of the root one.
[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
janitor-interface = { path = "../../crates/janitor-interface", default-features = false }
pinocchio = { version = "0.11", default-features = false, features = ["cpi"] }

[build-dependencies]
bs58 = "0.5"

[dev-dependencies]
janitor-interface = { path = "../../crates/janitor-interface" }
litesvm = "0.18"
solana-account = "4"
solana-keypair = "3"
solana-pubkey = "4"
solana-signer = "3"
solana-transaction = "4"
solana-message = "4"
solana-instruction = "3"
solana-transaction-error = "3"

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[lints.clippy]
unwrap_used = "warn"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
