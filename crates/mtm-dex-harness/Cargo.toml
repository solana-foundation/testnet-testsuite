[package]
name = "mtm-dex-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Env-injected keypairs, clap argument groups, and the ephemeral-user
# lifecycle used by the per-venue orchestrator CLIs.
cli = [
    "dep:anyhow",
    "dep:clap",
    "dep:serde_json",
    "dep:solana-commitment-config",
    "dep:solana-keypair",
]

[dependencies]
mtm-chain = { workspace = true }
rust_decimal = { workspace = true }
solana-instruction = { workspace = true }
solana-pubkey = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
solana-commitment-config = { workspace = true, optional = true }
solana-keypair = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
