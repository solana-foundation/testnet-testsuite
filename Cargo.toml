[workspace]
resolver = "2"
members = [
    "crates/mtm-chain",
    "crates/mtm-common",
    "crates/mtm-dex-harness",
    "crates/mtm-math",
    "crates/mtm-venues",
    "crates/mtm-telemetry",
    "crates/manifest-dex-client",
    "crates/manifest-dex-orchestrator",
    "crates/oracle-client",
    "crates/orca-whirlpool-client",
    "crates/orca-whirlpool-orchestrator",
    "crates/raydium-clmm-client",
    "crates/raydium-clmm-orchestrator",
    "crates/router-client",
    "crates/sdks/manifest",
    "services/manifest-dex-orchestrator",
    "services/oracle",
    "services/orca-whirlpool-orchestrator",
    "services/raydium-clmm-orchestrator",
    "services/router",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
mtm-chain = { path = "crates/mtm-chain" }
mtm-common = { path = "crates/mtm-common" }
mtm-dex-harness = { path = "crates/mtm-dex-harness" }
mtm-math = { path = "crates/mtm-math" }
mtm-venues = { path = "crates/mtm-venues" }
manifest-dex-client = { path = "crates/manifest-dex-client" }
manifest-dex-orchestrator = { path = "crates/manifest-dex-orchestrator" }
manifest-sdk = { path = "crates/sdks/manifest" }
mtm-telemetry = { path = "crates/mtm-telemetry" }
oracle-client = { path = "crates/oracle-client" }
orca-whirlpool-client = { path = "crates/orca-whirlpool-client" }
orca-whirlpool-orchestrator = { path = "crates/orca-whirlpool-orchestrator" }
raydium-clmm-client = { path = "crates/raydium-clmm-client" }
raydium-clmm-orchestrator = { path = "crates/raydium-clmm-orchestrator" }
router-client = { path = "crates/router-client" }

tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net"] }
futures = "0.3"
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["timeout"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "http2", "rustls", "webpki-roots"] }
# both ring (tungstenite) and aws-lc-rs (reqwest) end up compiled in — a
# process-default CryptoProvider must be installed at startup or rustls panics
rustls = "0.23"
base64 = "0.22"
wincode = "0.6"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rand = "0.10"
rand_chacha = "0.10"
rand_distr = "0.6"
rust_decimal = "1"

# codama-generated SDK deps (crates/sdks/*)
borsh = { version = "1", features = ["derive"] }
num-derive = "0.5"
num-traits = "0.2"
solana-account-info = "3"
solana-address = { version = "2", features = ["borsh", "curve25519"] }
solana-cpi = "3"
solana-program-error = "3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-rpc-client = "4.2.1"
solana-commitment-config = "3"
solana-compute-budget-interface = "3"
solana-hash = "4"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "4"
solana-native-token = "3"
solana-pubkey = "4"
solana-signature = "3"
solana-signer = "3"
solana-transaction = "4"
solana-account = "4.3"
solana-rpc-client-api = "4.2.1"
solana-account-decoder-client-types = "4"
anchor-lang = "0.32.1"
spl-associated-token-account = { version = "6", features = ["no-entrypoint"] }
spl-memo = "6"
spl-token = { version = "7", features = ["no-entrypoint"] }
spl-token-2022 = { version = "7", features = ["no-entrypoint"] }
sha2 = "0.10"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
figment = { version = "0.10", features = ["toml", "env"] }
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"

[profile.release]
overflow-checks = true
lto = "thin"
