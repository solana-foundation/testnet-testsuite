[workspace]
resolver = "2"
members = [
    "crates/oracle-client",
    "services/oracle",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
oracle-client = { path = "crates/oracle-client" }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net"] }
futures = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "http2", "rustls", "webpki-roots"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-rpc-client = "4"
solana-commitment-config = "3"
solana-keypair = "3"
solana-signer = "3"
solana-native-token = "3"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
figment = { version = "0.10", features = ["toml", "env"] }
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"

[profile.release]
overflow-checks = true
lto = "thin"
