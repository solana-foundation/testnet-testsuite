# Profile: testnet — the primary target cluster for this project.
# Public endpoints are rate-limited; swap in a dedicated RPC when generating real traffic.

[rpc]
http_url = "https://api.testnet.solana.com"
ws_url = "wss://api.testnet.solana.com"
# Per process, and every service on the host shares the public endpoint's
# per-IP limits (about 40 concurrent connections, 100 requests / 10 s): 8
# each keeps flow, mm, arb and scenario together under the connection cap.
# Raise it with a dedicated RPC (MTM_RPC__MAX_IN_FLIGHT).
max_in_flight = 8
