# Profile: scenario-devnet — the market-making scenario on Solana devnet.
# Layered over default.toml; select with MTM_PROFILE=scenario-devnet.
# Run with `just scenario-devnet` (see bootstrap/scenario/README.md).
#
# SOL targets are sized from the 2026-10-15 long runs (2 h worst case:
# Raydium LPs ~0.22 SOL/h in tick-array and position rent, everyone else
# < 0.005 SOL/h in fees) with headroom, instead of 2-3 SOL each: devnet SOL
# comes from rate-limited airdrops.
# Mirrors config/scenario-testnet.toml with devnet endpoints, no dev seed
# (SCENARIO_SEED must come from Doppler), and slower cadences: twelve makers
# polling every few seconds exceed the public RPC's rate limits, so point
# SCENARIO_RPC_URL at a dedicated endpoint for anything beyond a smoke run.

[rpc]
http_url = "https://api.devnet.solana.com"
ws_url = "wss://api.devnet.solana.com"

# --- oracle: keyless external prices -------------------------------------------
# Binance top-of-book for JUP and RAY; USDC pegged. Arrays replace the
# default profile's feeds, so no Pyth API key is needed.

# Scenario ports (8180-8181, 9180-9183) sit beside the default stack
# (8080/9100) so both can run on one machine.
[oracle]
listen_addr = "127.0.0.1:8180"
metrics_addr = "127.0.0.1:9180"

[[oracle.underlyings]]
symbol = "JUP/USDT"
binance_symbol = "JUPUSDT"

[[oracle.underlyings]]
symbol = "RAY/USDT"
binance_symbol = "RAYUSDT"

[[oracle.instruments]]
symbol = "JUP/USD"
base = { kind = "underlying", feed = "JUP/USDT" }

[[oracle.instruments]]
symbol = "RAY/USD"
base = { kind = "underlying", feed = "RAY/USDT" }

[[oracle.instruments]]
symbol = "USDC/USD"
base = { kind = "peg", target = "1.0000" }

# --- router: discover the scenario's pools, bridge through USDC -----------------
# Program IDs and bridge mints arrive as env (`just scenario-dev` sets them).

[router]
listen_addr = "127.0.0.1:8181"
metrics_addr = "127.0.0.1:9181"

[router.discovery]
enabled = true
interval_ms = 120000
probe_amount = 1000

# --- market makers + uninformed flow ------------------------------------------

[mm]
metrics_addr = "127.0.0.1:9182"

[flow]
metrics_addr = "127.0.0.1:9183"

[scenario]
seed_env = "SCENARIO_SEED"
oracle_url = "http://127.0.0.1:8180"
router_url = "http://127.0.0.1:8181"
max_price_age_ms = 60000

[scenario.programs]
raydium_clmm = "KEYPAIR_RAYDIUM_CLMM"
orca_whirlpool = "KEYPAIR_ORCA_WHIRLPOOL"
orca_whirlpools_config = "KEYPAIR_ORCA_WHIRLPOOLS_CONFIG"
manifest = "KEYPAIR_MANIFEST"
raydium_amm_config_index = 0
orca_tick_spacing = 64

[[scenario.tokens]]
name = "USDC"
mint_env = "PUBKEY_TOKEN_USDC_MINT"
oracle_symbol = "USDC/USD"

[[scenario.tokens]]
name = "JUP"
mint_env = "PUBKEY_TOKEN_JUP_MINT"
oracle_symbol = "JUP/USD"

[[scenario.tokens]]
name = "RAY"
mint_env = "PUBKEY_TOKEN_RAY_MINT"
oracle_symbol = "RAY/USD"

# Every venue lists JUP/USDC and RAY/USDC; JUP/RAY exists only on the AMMs,
# so large JUP↔RAY flow also exercises the router's USDC bridge.
[[scenario.pools]]
venue = "manifest"
base = "JUP"
quote = "USDC"

[[scenario.pools]]
venue = "manifest"
base = "RAY"
quote = "USDC"

[[scenario.pools]]
venue = "orca-whirlpool"
base = "JUP"
quote = "USDC"

[[scenario.pools]]
venue = "orca-whirlpool"
base = "RAY"
quote = "USDC"

[[scenario.pools]]
venue = "orca-whirlpool"
base = "JUP"
quote = "RAY"

[[scenario.pools]]
venue = "raydium-clmm"
base = "JUP"
quote = "USDC"

[[scenario.pools]]
venue = "raydium-clmm"
base = "RAY"
quote = "USDC"

# --- makers: one wallet each, different strategy / venue / inventory ----------

# Tight, deep, symmetric JUP book.
[[scenario.makers]]
name = "clob-jup-tight"
sol = "0.1"
venue = "manifest"
base = "JUP"
quote = "USDC"
interval_ms = 10000
inventory = { JUP = "60000", USDC = "20000" }
strategy = { kind = "clob-ladder", levels = 5, spread_bps = 10, step_bps = 8, level_size = "1500", refresh_bps = 5 }

# Wider RAY book that leans against its inventory.
[[scenario.makers]]
name = "clob-ray-skew"
sol = "0.1"
venue = "manifest"
base = "RAY"
quote = "USDC"
interval_ms = 15000
inventory = { RAY = "6000", USDC = "15000" }
strategy = { kind = "clob-ladder", levels = 3, spread_bps = 30, step_bps = 20, level_size = "400", refresh_bps = 10, skew_bps = 60, target_base_ratio = "0.5" }

# Concentrated liquidity providers.
[[scenario.makers]]
name = "lp-orca-jup"
sol = "0.3"
venue = "orca-whirlpool"
base = "JUP"
quote = "USDC"
interval_ms = 25000
inventory = { JUP = "40000", USDC = "15000" }
strategy = { kind = "clmm-range", width_bps = 600, recenter_bps = 200, position_usd = "20000" }

[[scenario.makers]]
name = "lp-orca-ray"
sol = "0.3"
venue = "orca-whirlpool"
base = "RAY"
quote = "USDC"
interval_ms = 25000
inventory = { RAY = "6000", USDC = "15000" }
strategy = { kind = "clmm-range", width_bps = 1000, recenter_bps = 300, position_usd = "20000" }

[[scenario.makers]]
name = "lp-orca-jup-ray"
sol = "0.3"
venue = "orca-whirlpool"
base = "JUP"
quote = "RAY"
interval_ms = 25000
inventory = { JUP = "30000", RAY = "4500" }
strategy = { kind = "clmm-range", width_bps = 1500, recenter_bps = 500, position_usd = "15000" }

[[scenario.makers]]
name = "lp-raydium-jup"
sol = "0.75"
venue = "raydium-clmm"
base = "JUP"
quote = "USDC"
interval_ms = 25000
inventory = { JUP = "30000", USDC = "12000" }
strategy = { kind = "clmm-range", width_bps = 800, recenter_bps = 250, position_usd = "15000" }

[[scenario.makers]]
name = "lp-raydium-ray"
sol = "0.75"
venue = "raydium-clmm"
base = "RAY"
quote = "USDC"
interval_ms = 25000
inventory = { RAY = "5000", USDC = "12000" }
strategy = { kind = "clmm-range", width_bps = 1200, recenter_bps = 400, position_usd = "15000" }

# Arbitrageurs: pull each AMM back to the oracle after flow pushes it away.
# They trade when an executable price (fees included) beats the oracle by
# `threshold_bps`, so each pool settles within fee + threshold of the oracle.
[[scenario.makers]]
name = "arb-orca-jup"
sol = "0.1"
venue = "orca-whirlpool"
base = "JUP"
quote = "USDC"
interval_ms = 10000
inventory = { JUP = "30000", USDC = "10000" }
strategy = { kind = "pool-arb", threshold_bps = 10, max_trade_usd = "3000" }

[[scenario.makers]]
name = "arb-orca-ray"
sol = "0.1"
venue = "orca-whirlpool"
base = "RAY"
quote = "USDC"
interval_ms = 10000
inventory = { RAY = "4000", USDC = "10000" }
strategy = { kind = "pool-arb", threshold_bps = 10, max_trade_usd = "3000" }

[[scenario.makers]]
name = "arb-orca-jup-ray"
sol = "0.1"
venue = "orca-whirlpool"
base = "JUP"
quote = "RAY"
interval_ms = 15000
inventory = { JUP = "30000", RAY = "4000" }
strategy = { kind = "pool-arb", threshold_bps = 15, max_trade_usd = "2000" }

[[scenario.makers]]
name = "arb-raydium-jup"
sol = "0.1"
venue = "raydium-clmm"
base = "JUP"
quote = "USDC"
interval_ms = 12500
inventory = { JUP = "30000", USDC = "10000" }
strategy = { kind = "pool-arb", threshold_bps = 10, max_trade_usd = "3000" }

[[scenario.makers]]
name = "arb-raydium-ray"
sol = "0.1"
venue = "raydium-clmm"
base = "RAY"
quote = "USDC"
interval_ms = 12500
inventory = { RAY = "4000", USDC = "10000" }
strategy = { kind = "pool-arb", threshold_bps = 10, max_trade_usd = "3000" }

# --- uninformed flow: random takers routing through the router ----------------

[scenario.flow]
takers = 4
rate_per_min = 4.0
median_usd = 150.0
sigma = 1.0
large_probability = 0.08
large_multiplier = 40.0
exact_out_probability = 0.1
slippage_bps = 150
pairs = [["JUP", "USDC"], ["RAY", "USDC"], ["JUP", "RAY"]]
inventory = { JUP = "60000", RAY = "8000", USDC = "25000" }
sol = "0.1"
refill_below_ratio = "0.25"
rng_seed = 7

# --- cross-venue arbitrage: reacts to pool changes caused by flow -------------
# Oracle-free: searches 2-leg (same pair, two venues) and 3-leg (triangular)
# cycles across every pool above whenever a pool account changes.

[arb]
metrics_addr = "127.0.0.1:9184"

[scenario.arb]
poll_ms = 5000
debounce_ms = 250

[[scenario.arb.bots]]
name = "searcher"
start_tokens = ["USDC", "JUP", "RAY"]
max_legs = 3
min_profit_usd = "0.50"
max_trade_usd = "5000"
leg_slippage_bps = 5
inventory = { USDC = "20000", JUP = "50000", RAY = "8000" }
sol = "0.1"
